name: Build GARAM CLAP (Windows)

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Clone CLAP SDK
      run: git clone https://github.com/free-audio/clap.git

    - name: Fix garam.cpp
      run: |
        (Get-Content garam.cpp) -replace '#include "clap/clap.h"', '#include "clap/clap.h"`n#include <cstdio>' | Set-Content garam.cpp

    - name: Create CMakeLists for Windows
      run: |
        @"
        cmake_minimum_required(VERSION 3.15)
        project(GARAM VERSION 1.0.0)
        set(CMAKE_CXX_STANDARD 17)
        add_library(GARAM MODULE garam.cpp)
        target_include_directories(GARAM PRIVATE clap/include)
        set_target_properties(GARAM PROPERTIES PREFIX "" SUFFIX ".clap")
        "@ | Set-Content CMakeLists.txt

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GARAM-Windows-CLAP
        path: build/Release/GARAM.clap
