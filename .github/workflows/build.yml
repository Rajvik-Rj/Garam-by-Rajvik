name: Build GARAM CLAP Windows

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone CLAP SDK
        run: git clone --depth 1 https://github.com/free-audio/clap.git clap-sdk

      - name: Write CMakeLists
        run: |
          echo cmake_minimum_required(VERSION 3.15) > CMakeLists.txt
          echo project(GARAM) >> CMakeLists.txt
          echo set(CMAKE_CXX_STANDARD 17) >> CMakeLists.txt
          echo add_library(GARAM MODULE garam.cpp) >> CMakeLists.txt
          echo target_include_directories(GARAM PRIVATE clap-sdk/include) >> CMakeLists.txt
          echo set_target_properties(GARAM PROPERTIES PREFIX "" SUFFIX ".clap") >> CMakeLists.txt
        shell: cmd

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GARAM-Windows-CLAP
          path: build/Release/GARAM.clap
